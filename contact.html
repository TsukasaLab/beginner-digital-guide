<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>お問い合わせ｜かんたんデジタル案内所</title><link rel='stylesheet' href='style.css'></head><body><header><div class='wrap'><a class='logo' href='index.html'>かんたんデジタル案内所 <span>BETA</span></a><nav><a href='index.html'>ホーム</a></nav></div></header><main class='wrap'><section class='pagehead'><h1>お問い合わせ・ご意見</h1><p>不具合、分かりにくかった説明、追加してほしい内容などを送れます。</p></section><form class='form' id='contactForm'><div class='notice'>現在は公開準備版です。メール送信はCloudflare側の送信機能を接続後に有効になります。</div><label>対象 <span class='req'>必須</span></label><select name='target' required><option value=''>選んでください</option><option>サイト全体</option><option>Androidスマホ編</option><option>Windowsパソコン編</option><option>CarLog</option><option>PriceLog</option><option>その他</option></select><label>内容の種類 <span class='req'>必須</span></label><select name='type' required><option value=''>選んでください</option><option>不具合</option><option>分かりにくい</option><option>改善してほしい</option><option>欲しい機能・記事</option><option>その他</option></select><label>お問い合わせ内容 <span class='req'>必須</span></label><textarea name='message' required placeholder='できるだけ具体的に書いてください'></textarea><label>返信</label><select name='reply' id='reply'><option value='no'>返信は不要</option><option value='yes'>返信を希望する</option></select><div id='emailArea' hidden><label>返信先メールアドレス</label><input type='email' name='email' autocomplete='email'></div><p>送信先：運営者の問い合わせ用メール（メールアドレスはサイト上には公開しません）</p><button class='button' type='submit'>内容を確認する</button><div class='status' id='status'></div></form></main><footer>© 2026 かんたんデジタル案内所</footer><script src='contact.js'></script></body></html>
