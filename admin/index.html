<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>問い合わせ管理</title><link rel="stylesheet" href="../style.css"></head><body><header><div class="wrap"><a class="logo" href="../index.html">かんたんデジタル案内所 <span>ADMIN</span></a></div></header><main class="wrap"><section class="pagehead"><h1>問い合わせ管理</h1><p>この管理画面は、最初に登録した1台のPCだけで利用できます。</p></section>
<section id="loginPanel" class="form adminlogin" hidden><div id="loginNotice" class="notice"></div><label for="adminPassword">管理者パスワード</label><input id="adminPassword" type="password" autocomplete="current-password"><button id="loginButton" class="button" type="button">ログイン</button><div id="loginStatus" class="status"></div></section>
<section id="adminPanel" hidden><div class="adminbar"><button data-filter="unanswered">未回答</button><button data-filter="answered">回答済み</button><button data-filter="all">すべて</button><button id="reload">更新</button><button id="logout">ログアウト</button><button id="unregister" class="dangerbutton">このPCの管理者登録を解除</button></div><div id="adminStatus" class="status"></div><div id="list" class="adminlist"></div></section>
</main><script src="admin.js"></script></body></html>
